name: Test

on:
  pull_request:
  push:
    branches: [main]
  workflow_call:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker run --rm -v "$PWD:/plugin" trmnl/trmnlp test
      - run: docker run --rm -v "$PWD:/plugin" trmnl/trmnlp lint
      - run: bin/screenshots
      - name: Fail if committed screenshots are stale
        run: |
          status="$(git status --porcelain docs/screenshots)"
          if [ -n "$status" ]; then echo "$status"; echo "Run bin/screenshots and commit docs/screenshots."; exit 1; fi
