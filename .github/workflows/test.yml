name: Test

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker run --rm -v "$PWD:/plugin" trmnl/trmnlp test
      - run: docker run --rm -v "$PWD:/plugin" trmnl/trmnlp lint
      - run: bin/screenshots
      - name: Fail if committed screenshots are stale
        run: git diff --exit-code --stat -- docs/screenshots || (echo "Run bin/screenshots and commit docs/screenshots." && exit 1)
