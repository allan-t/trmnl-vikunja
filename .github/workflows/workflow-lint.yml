name: Workflow lint

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  workflow-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Lint GitHub workflow files
        run: docker run --rm -v "$PWD:/repo" -w /repo rhysd/actionlint:latest
