services:
  preview:
    image: trmnl/trmnlp
    command: serve
    ports:
      - "4567:4567"
    volumes:
      - .:/plugin
    environment:
      VIKUNJA_BASE_URL: ${VIKUNJA_BASE_URL:-https://app.vikunja.cloud}
      VIKUNJA_API_TOKEN: ${VIKUNJA_API_TOKEN:-}

  test:
    image: trmnl/trmnlp
    command: test
    profiles: [test]
    volumes:
      - .:/plugin
