---
strategy: polling
no_screen_padding: 'no'
dark_mode: 'no'
static_data: ''
polling_verb: get
framework_version: latest
serverless_language: ''
refresh_interval_floor: ''
polling_url: "{%- assign per_page = 50 %}{% if task_source_mode == 'custom_filter' %}{% assign tasks_filter_raw = custom_filter | default: '' %}{% assign filter_text = tasks_filter_raw | strip %}{% assign tasks_filter_normalised = tasks_filter_raw | replace: 'dueDate', 'due_date' | replace: 'startDate', 'start_date' | replace: 'endDate', 'end_date' | replace: 'doneAt', 'done_at' | replace: 'percentDone', 'percent_done' | replace: 'createdBy', 'created_by' %}{% assign tasks_filter = tasks_filter_normalised | url_encode %}{% if filter_text == '' %}{% assign per_page = 1 %}{% endif %}{% else %}{% if priority_levels == blank %}{% assign priority_levels_normalised = '0,1,2,3,4,5' | split: ',' %}{% else %}{% assign priority_levels_normalised = priority_levels | join: ',' | split: ',' %}{% endif %}{% capture tasks_filter %}done%20%3D%20false%20%26%26%20(priority%20%3D%20{{ priority_levels_normalised | join: '%20%7C%7C%20priority%20%3D%20' }}){% endcapture %}{% endif -%}\r\n{{ base_url | default: 'https://app.vikunja.cloud' | split: '/' | join: '/' }}/api/v2/tasks?per_page={{ per_page }}&filter={{ tasks_filter }}&sort_by=due_date&sort_by=priority&order_by=asc&order_by=desc\r\n{{ base_url | default: 'https://app.vikunja.cloud' | split: '/' | join: '/' }}/api/v2/projects"
polling_headers: authorization=Bearer {{ api_token }}
polling_body: ''
id: 520678
oauth_enabled: 'false'
oauth_pkce_enabled: 'no'
custom_fields:
- keyname: base_url
  field_type: string
  name: Vikunja base URL
  description: Leave blank for Vikunja Cloud. Self-hosting? Enter your instance URL, e.g. vikunja.example.com with https in front.
  placeholder: https://app.vikunja.cloud
  default: https://app.vikunja.cloud
  optional: true
- keyname: api_token
  field_type: password
  name: Vikunja API token
  description: Create one in Vikunja under Settings > API Tokens (read access to Tasks and Projects).
- keyname: task_source_mode
  field_type: select
  name: Filter mode
  group: Filter options
  description: Mode decides which Tasks show. Standard uses the Projects and Priority settings below. Custom filter uses only the filter you write.
  default: standard
  options:
  - Standard: standard
  - Custom filter: custom_filter
  conditional_validation:
  - when: custom_filter
    hidden:
    - project_names
    - priority_levels
    visible:
    - custom_filter
- keyname: custom_filter
  field_type: string
  optional: true
  name: Custom filter
  group: Filter options
  description: Custom filter mode only. Replaces the Projects and Priority settings. Syntax at vikunja.io/docs/filters. UI camelCase fields are accepted and rewritten to API snake_case.
  placeholder: done = false && priority >= 3
- keyname: project_names
  field_type: multi_string
  optional: true
  name: Projects to show
  group: Filter options
  description: Standard mode only. Only Tasks from these Projects are shown. Enter Project names, separated by commas. Leave empty to show all Projects.
  placeholder: Home, Work
- keyname: priority_levels
  field_type: select
  multiple: true
  optional: true
  name: Priority levels to show
  group: Filter options
  description: Standard mode only. Only Tasks with these Priorities are shown. Leave empty to show all.
  help_text: Use <kbd>⌘</kbd>+<kbd>click</kbd> or <kbd>ctrl</kbd>+<kbd>click</kbd> to select and deselect multiple options.
  options:
  - Unset: 0
  - Low: 1
  - Medium: 2
  - High: 3
  - Urgent: 4
  - Do now: 5
- keyname: group_by_project
  field_type: boolean
  name: Group by Project
  group: Display options
  description: Show Tasks under a header per Project. Switch off for one list with Project - Task rows.
  default: true
- keyname: task_sort_field
  field_type: select
  name: Task sort field
  group: Display options
  description: Sort field for Tasks. In grouped mode this sorts Tasks within each Project group.
  default: due_date
  options:
  - Unsorted: unsorted
  - Due date: due_date
  - Priority: priority
  - Project: project
  - Alphabetical: alphabetical
- keyname: task_sort_direction
  field_type: select
  name: Task sort direction
  group: Display options
  description: Sort direction for Task sorting. Ignored when Task sort field is Unsorted.
  default: asc
  options:
  - Ascending: asc
  - Descending: desc
- keyname: project_sort_field
  field_type: select
  name: Project group sort field
  group: Display options
  description: Grouped mode only. Sort order for Project headers.
  default: unsorted
  options:
  - Unsorted: unsorted
  - Alphabetical: alphabetical
  - Project filter order: project_filter_order
- keyname: project_sort_direction
  field_type: select
  name: Project group sort direction
  group: Display options
  description: Grouped mode only. Sort direction for Project header ordering. Ignored when Project group sort field is Unsorted.
  default: asc
  options:
  - Ascending: asc
  - Descending: desc
- keyname: author_bio
  field_type: author_bio
  name: About This Recipe
  description: Displays your open Vikunja Tasks across all Projects.
  github_url: https://github.com/allan-t/trmnl-vikunja
name: Vikunja Tasks
description: Open Vikunja Tasks at a glance
refresh_interval: 15
